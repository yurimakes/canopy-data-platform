contract_version: canopy-weekly-data-contract-v1
status: proposed
updated_at: "2026-09-16"

scope:
  description: "Weekly Summary, Baseline, Mission Profile/Bundle, Reward, Mission Response, Behavior Change, Ranking, Campaign KPI의 데이터 의존성 계약"
  canonical_processing_store: ADLS_Gold
  operational_state_store: Cosmos_DB

principles:
  - "Weekly Summary is the shared weekly behavior fact layer."
  - "Baseline and Mission Profile are parallel downstream branches of Weekly Summary."
  - "Behavior Change is downstream of Mission execution/response; it is not an input prerequisite for Mission Profile."
  - "Personal Baseline for evaluation week W excludes week W Trips and uses prior completed weeks only."
  - "Global Baseline for week W is the equal-weight mean of ready Personal Baselines for week W."
  - "The Baseline snapshot used for Reward is frozen for the whole evaluation week."
  - "Base carbon Reward is Trip-grain and does not require mission completion."
  - "Personal-not-ready cold start uses an externally supplied Population Baseline; no Population number is hardcoded."
  - "Cosmos latest Baseline is operational serving only; downstream batch processing reads ADLS Gold."
  - "Mission Bundle is one per user+campaign+week and contains one assignment per MVP category."
  - "Mission preference learns only from completed, preference-comparable assignments; non-completion is neutral."

weekly_cycle_example:
  source_week: 2026-W38
  effective_week: 2026-W39
  sequence:
    - "W38 ready Trips -> Weekly User Gold W38"
    - "Weekly Gold W38 -> Eligibility/Personal/Global snapshot effective W39"
    - "Weekly Gold W38 + mission history through W38 -> Mission Profile effective W39"
    - "Mission Profile -> Mission Bundle W39"
    - "W39 ready Trip -> Trip Reward using frozen W39 Baseline snapshot"
    - "W39 ready Trip -> Mission Progress for all eligible assignments"
    - "W39 Mission outcomes -> Mission Response W39"
    - "Mission Response + before/after behavior -> Behavior Change"
    - "Reward Ledger -> Ranking Snapshot"
    - "Weekly/Mission/Behavior/Global outputs -> Campaign KPI"

dependencies:
  canonical_trip:
    produces: [weekly_user_gold, trip_reward_input, mission_progress_input]

  weekly_user_gold:
    depends_on: [canonical_trip]
    produces: [baseline_eligibility, personal_baseline, mission_profile, campaign_kpi]

  baseline_eligibility:
    depends_on: [weekly_user_gold, campaign_membership, eligibility_policy]
    produces: [personal_baseline, global_baseline]

  personal_baseline:
    depends_on: [weekly_user_gold, baseline_eligibility, baseline_policy]
    produces: [global_baseline, reward_calculation, behavior_change]

  global_baseline:
    depends_on: [personal_baseline, baseline_eligibility, baseline_policy]
    produces: [reward_calculation, behavior_change, campaign_kpi]

  mission_profile:
    depends_on: [weekly_user_gold, mission_bundle_history, mission_policy]
    explicitly_not_dependent_on: [behavior_change, reward_ledger, global_baseline]
    produces: [mission_bundle]

  mission_bundle:
    depends_on: [mission_profile, mission_policy]
    produces: [mission_progress, mission_response]

  mission_progress:
    depends_on: [mission_bundle, canonical_trip]
    produces: [mission_response, next_mission_profile_history]

  reward_calculation:
    depends_on: [canonical_trip, personal_baseline, global_baseline, population_baseline_external, reward_policy]
    explicitly_not_dependent_on: [mission_response, behavior_change]
    produces: [reward_ledger]

  reward_ledger:
    depends_on: [reward_calculation]
    produces: [ranking_snapshot, reward_api]

  mission_response:
    depends_on: [mission_bundle, mission_progress, mission_events, canonical_trip]
    produces: [behavior_change, next_mission_profile_history, campaign_kpi]

  behavior_change:
    depends_on: [mission_response, weekly_user_gold, personal_baseline, behavior_change_policy]
    produces: [campaign_kpi]

  ranking_snapshot:
    depends_on: [reward_ledger, ranking_policy, user_department]

  campaign_kpi:
    depends_on: [weekly_user_gold, mission_response, behavior_change, global_baseline]

datasets:
  weekly_user_gold:
    producer: cloud/azure/pipelines/databricks/build_weekly_summary.py
    storage: "abfss://curated@stcanopydev5dt.dfs.core.windows.net/gold/weekly_summary_user/"
    grain: "user_id + campaign_id + week"
    key: [user_id, campaign_id, week]
    required_core_fields:
      - trip_count
      - total_distance_m
      - total_kg_co2e
      - carbon_policy_version
      - factor_version
    mission_behavior_extension:
      primary_mode_rule: unique_max_segment_distance
      fields:
        - valid_primary_trip_count
        - ambiguous_primary_trip_count
        - car_primary_trip_count
        - transit_primary_trip_count
        - low_carbon_trip_count
        - short_car_trip_count
        - car_primary_ratio
        - short_car_share
      short_car_definition: "primary_mode=car AND trip_distance_m <= 2000"

  personal_baseline_history:
    producer: cloud/azure/pipelines/databricks/build_personal_baseline.py
    storage: ".../gold/personal_baseline_history/"
    grain: "user_id + campaign_id + evaluation week"
    key: [user_id, campaign_id, week]
    source_time_rule: "week W snapshot uses only completed weeks before W"
    important_fields:
      - value
      - status
      - method
      - policy_version
      - eligibility_policy_version
      - cumulative_g_co2e
      - cumulative_distance_km

  global_baseline_history:
    producer: cloud/azure/pipelines/databricks/build_global_baseline.py
    storage: ".../gold/global_baseline_history/"
    grain: "campaign_id + evaluation week"
    key: [campaign_id, week]
    important_fields:
      - value
      - status
      - valid_participant_count
      - eligible_participant_count
      - policy_version
      - eligibility_policy_version

  mission_profile_history:
    producer: cloud/azure/pipelines/databricks/build_mission_profile.py
    storage: ".../gold/mission_profile/"
    grain: "user_id + campaign_id + source_week_start"
    key: [user_id, campaign_id, source_week_start]
    effective_week_rule: "effective_week_start == source_week_end"
    inputs:
      - weekly_user_gold
      - Cosmos mission_bundle history
    important_fields:
      - source_week_start
      - source_week_end
      - effective_week_start
      - profile_status
      - car_ratio
      - short_car_trip_count
      - short_car_share
      - transit_primary_trip_count
      - low_carbon_trip_count
      - carbon_change_rate
      - category_preferences_json
      - difficulty_state_json
      - family_capability_json
      - profile_version
      - profile_hash

  mission_bundle:
    producer: cloud/azure/functions/func_canopy_dev/mission_engine.py
    storage: Cosmos_DB
    grain: "one document per user_id + campaign_id + week_start"
    key: [campaign_id, user_id, week_start]
    immutable_issue_contract: true
    assignment_key: [campaign_id, user_id, week_start, category_id]
    mvp_categories: [challenge, habit, easy_win, explore]
    assignment_fields:
      - assignment_id
      - category_id
      - mission_template_id
      - mission_family
      - difficulty_band
      - target_count
      - preference_comparable
      - progress_count
      - achievement_rate
      - completed

  reward_calculation:
    producer: cloud/azure/pipelines/databricks/calculate_reward.py
    storage: ".../gold/reward_calculation/"
    grain: "trip_id + reward_type"
    key: [campaign_id, user_id, trip_id, reward_type]
    reward_type: trip_carbon
    baseline_context: weekly_frozen
    inputs:
      - canonical ready Trip
      - Personal Baseline history for evaluation week
      - Global Baseline history for evaluation week
      - external Population Baseline when Personal is not ready
    important_fields:
      - trip_id
      - actual_g_co2e_per_km
      - baseline_source
      - selected_baseline_g_co2e_per_km
      - status
      - points
      - payable
      - policy_version
      - baseline_policy_version
      - carbon_policy_version
      - factor_version

  reward_ledger:
    producer: cloud/azure/pipelines/databricks/reward_ledger.py
    authoritative_write_store: Cosmos_DB
    audit_mirror: ".../gold/reward_ledger_history/"
    grain: "one base reward per reward_type + source action"
    base_reward_identity: [campaign_id, user_id, reward_type, source_id]
    trip_carbon_source_id: trip_id
    policy_change_rule: "Do not issue a second base reward for a policy revision; use adjustment records."

  mission_response_weekly:
    producer: build_mission_response.py
    storage: ".../gold/mission_response_weekly/"
    grain: "assignment_id + week"
    key: [campaign_id, user_id, assignment_id, week]
    important_fields:
      - bundle_id
      - assignment_id
      - mission_template_id
      - category_id
      - difficulty_band
      - target_count
      - preference_comparable
      - progress_count
      - achievement_rate
      - mission_completed_count

  behavior_change_weekly:
    producer: build_behavior_change.py
    storage: ".../gold/behavior_change/"
    grain: "user + intervention/assignment + evaluation window"
    important_fields:
      - before_behavior
      - after_behavior
      - shift_flag
      - reason
      - policy_version

storage_roles:
  ADLS_Gold:
    role: "canonical processing/history source"
    examples: [weekly_user_gold, baseline_history, mission_profile_history, reward_calculation, reward_ledger_history, mission_response, behavior_change]
  Cosmos_DB:
    role: "operational state / atomic ledger / low-latency serving"
    examples: [mission_profile_latest, mission_bundle, reward_ledger, baseline_latest, ranking_snapshot]

change_log:
  "2026-09-16":
    reward_pr_26_preserved:
      - "ADLS Gold processing source"
      - "Personal improvement before Global maintenance"
      - "Cosmos create_item for atomic duplicate prevention"
      - "ADLS reward ledger mirror"
      - "point conversion rate remains unset until team agreement"
    compatibility_corrections:
      - "Reward grain changed from user/week to Trip to match baseline-policy-v4 reward_context.granularity=trip."
      - "Cold start changed from Personal/Global missing => not_eligible to external Population fallback."
      - "Base carbon Reward no longer depends on Mission Response."
      - "Base reward identity changed from user+campaign+week to campaign+user+reward_type+source_id(trip_id)."
      - "points=null is never written as paid; calculation remains auditable but payable=false."
    weekly_summary_extension:
      - "Added primary-mode and short-car facts so Mission Profile can use Weekly Gold rather than rescanning canonical Trips."
