permissions:
  contents: read

name: Baseline code execution check

on:
  pull_request:
    paths:
      - "cloud/azure/pipelines/databricks/**"
      - "shared/schemas/databricks_job_weekly_summary.json"
      - ".github/workflows/baseline-code-check.yml"
  workflow_dispatch:

jobs:
  baseline-code-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/azure/pipelines/databricks/baseline_integration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install calculation test dependencies
        run: >-
          python -m pip install
          "pytest>=8,<9"
          "pandas>=2,<3"
          "pyarrow>=15,<20"
          "pyspark==3.5.1"
          "pyyaml>=6,<7"
      - name: Compile baseline modules
        run: >-
          python -m py_compile
          baseline_runtime.py
          cosmos_baseline_writer.py
          publish_baseline_snapshots.py
          ../build_personal_baseline.py
          ../build_global_baseline.py
          ../build_weekly_summary.py
          ../sync_confirmed_trips.py
      - name: Run baseline code execution tests
        run: python -m pytest -q tests
