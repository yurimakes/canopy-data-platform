policy_version: mission-policy-v3

week:
  start_day: monday
  interval: "[week_start, week_end)"

principles:
  # 사용자가 미션을 고르는 구조가 아니라 서버가 카테고리별 미션을 함께 부여한다.
  system_assigns_missions: true
  one_mission_per_category_in_mvp: true
  user_selection_required: false
  completion_is_positive_preference_signal: true
  noncompletion_is_not_negative_preference_signal: true
  category_preference_is_separate_from_difficulty: true
  equalize_difficulty_across_categories: true
  first_week_without_profile_is_supported: true

categories:
  challenge:
    label: "도전형"
    description: "목표를 달성하는 재미와 도전감을 강조하는 제시 방식"
    sort_order: 10
  habit:
    label: "꾸준형"
    description: "반복 가능한 습관과 지속성을 강조하는 제시 방식"
    sort_order: 20
  easy_win:
    label: "가벼운 실천형"
    description: "부담이 작고 바로 실행 가능한 성취를 강조하는 제시 방식"
    sort_order: 30
  explore:
    label: "새로운 시도형"
    description: "평소와 다른 이동 방식이나 새로운 실천을 강조하는 제시 방식"
    sort_order: 40

preference_learning:
  method: positive_completion_dirichlet
  prior_per_category: 1.0
  completed_comparable_mission_adds: 1.0
  noncompletion_adds: 0.0
  partial_progress_adds: 0.0
  only_preference_comparable_missions_update: true
  note: "완료는 해당 성향의 긍정 신호로만 사용한다. 미완료 원인은 난이도·기회 부족·무관심을 구분하기 어려우므로 선호 감점으로 해석하지 않는다."

profile:
  short_car_max_distance_km: 2.0
  low_carbon_modes: [walk, bike, bus, rail]
  transit_modes: [bus, rail]
  primary_mode_rule: unique_max_segment_distance
  ambiguous_primary_mode_status: exclude_trip_and_record_reason
  zero_car_short_share: null

difficulty:
  # 같은 주에 비교되는 카테고리 미션은 가능한 한 동일한 난이도 단위를 사용한다.
  common_target_across_categories: true
  first_target_count: 1
  completed_all_comparable_increment: 1
  completed_none_comparable_decrement: 1
  partial_completion_strategy: hold
  minimum_target_count: 1
  opportunity_ceiling: true
  comparable_when_target_matches_common_target: true
  note: "카테고리 성향과 난이도를 섞지 않는다. 도전형이라고 객관적 난이도를 더 높이지 않는다."

catalog_health:
  enabled: true
  comparison_scope: same_category_and_difficulty_band
  metrics:
    - assigned_user_count
    - comparable_assignment_count
    - completed_user_count
    - completion_rate
    - average_progress_rate
  automatic_retirement: false
  minimum_comparable_assignments: null
  consecutive_underperforming_weeks: null
  underperformance_margin: null
  action_when_threshold_met: review_candidate
  note: "표본 기준과 교체 임계값은 팀 합의 전 임의로 넣지 않는다. 성과가 낮은 미션은 자동 삭제하지 않고 검토 후보로 올린 뒤 새 템플릿으로 교체한다."

catalog:
  challenge_short_car_to_active:
    status: active
    category_id: challenge
    family: short_car_to_active
    difficulty_band: standard
    title: "가까운 자동차 이동을 걷기·자전거로 바꿔 보기"
    accepted_modes: [walk, bike]
    max_distance_km: 2.0
    eligibility:
      field: short_car_trip_count
      gt: 0
    opportunity_field: short_car_trip_count
    priority: 10

  challenge_car_to_transit:
    status: active
    category_id: challenge
    family: car_to_transit
    difficulty_band: standard
    title: "자동차 이동을 대중교통으로 바꿔 보기"
    accepted_modes: [bus, rail]
    eligibility:
      field: car_primary_trip_count
      gt: 0
    opportunity_field: car_primary_trip_count
    priority: 20

  challenge_starter:
    status: active
    category_id: challenge
    family: low_carbon_action
    difficulty_band: standard
    title: "이번 주 친환경 이동 목표 달성하기"
    accepted_modes: [walk, bike, bus, rail]
    cold_start: true
    priority: 100

  habit_low_carbon_maintain:
    status: active
    category_id: habit
    family: low_carbon_maintain
    difficulty_band: standard
    title: "친환경 이동 습관 꾸준히 이어가기"
    accepted_modes: [walk, bike, bus, rail]
    eligibility:
      field: low_carbon_trip_count
      gt: 0
    opportunity_field: low_carbon_trip_count
    priority: 10

  habit_transit_repeat:
    status: active
    category_id: habit
    family: transit_habit
    difficulty_band: standard
    title: "대중교통 이용 습관 이어가기"
    accepted_modes: [bus, rail]
    eligibility:
      field: transit_primary_trip_count
      gt: 0
    opportunity_field: transit_primary_trip_count
    priority: 20

  habit_starter:
    status: active
    category_id: habit
    family: low_carbon_habit
    difficulty_band: standard
    title: "이번 주 친환경 이동 습관 만들기"
    accepted_modes: [walk, bike, bus, rail]
    cold_start: true
    priority: 100

  easy_short_active:
    status: active
    category_id: easy_win
    family: short_car_to_active
    difficulty_band: standard
    title: "가까운 거리 가볍게 걷기·자전거로 이동하기"
    accepted_modes: [walk, bike]
    max_distance_km: 2.0
    eligibility:
      field: short_car_trip_count
      gt: 0
    opportunity_field: short_car_trip_count
    priority: 10

  easy_transit:
    status: active
    category_id: easy_win
    family: car_to_transit
    difficulty_band: standard
    title: "자동차 대신 대중교통 이용하기"
    accepted_modes: [bus, rail]
    eligibility:
      field: car_primary_trip_count
      gt: 0
    opportunity_field: car_primary_trip_count
    priority: 20

  easy_starter:
    status: active
    category_id: easy_win
    family: low_carbon_action
    difficulty_band: standard
    title: "부담 없이 친환경 이동 실천하기"
    accepted_modes: [walk, bike, bus, rail]
    cold_start: true
    priority: 100

  explore_active:
    status: active
    category_id: explore
    family: explore_active
    difficulty_band: standard
    title: "걷기·자전거 이동을 새롭게 시도하기"
    accepted_modes: [walk, bike]
    eligibility:
      field: short_car_trip_count
      gt: 0
    opportunity_field: short_car_trip_count
    priority: 10

  explore_transit:
    status: active
    category_id: explore
    family: explore_transit
    difficulty_band: standard
    title: "대중교통 이동을 새롭게 시도하기"
    accepted_modes: [bus, rail]
    eligibility:
      field: car_primary_trip_count
      gt: 0
    opportunity_field: car_primary_trip_count
    priority: 20

  explore_starter:
    status: active
    category_id: explore
    family: explore_low_carbon
    difficulty_band: standard
    title: "평소와 다른 친환경 이동 한 번 시도하기"
    accepted_modes: [walk, bike, bus, rail]
    cold_start: true
    priority: 100

assignment:
  weekly_bundle_unique_key: campaign_id + user_id + week_start
  mission_assignment_unique_key: campaign_id + user_id + week_start + category_id
  freeze_bundle_after_issue: true
  replace_only_next_week: true
