policy_version: "reward-policy-v2"
baseline_policy_version: "baseline-policy-v4"

reward_types:
  trip_carbon:
    granularity: trip
    source_dataset: "curated/confirmed_trips"
    baseline_snapshot_cadence: weekly
    freeze_snapshot_within_week: true
    mission_completion_required: false
    note: "기본 탄소 보상은 각 ready Trip을 평가한다. 미션 완료 여부는 별도 mission_bonus 정책에서 다룬다."

baseline_usage:
  improvement_check: personal_baseline
  maintenance_check: global_baseline
  cold_start_check: population_baseline
  note: "Personal은 과거의 나 대비 개선, Global은 Personal-ready 사용자의 낮은 배출 유지, Population은 Personal이 준비되지 않은 cold start에 사용한다."

eligibility:
  required_trip_status: ready
  require_positive_trip_distance: true
  personal_not_ready_fallback: population_baseline
  first_week_source: population_baseline
  population_value_must_be_external: true
  population_env: CANOPY_POPULATION_BASELINE_G_CO2E_PER_KM
  population_source_env: CANOPY_POPULATION_BASELINE_SOURCE_ID
  note: "Population 숫자는 코드에 하드코딩하지 않는다. 값/출처가 주입되지 않은 cold start Trip은 계산 결과를 남기되 지급 불가로 처리한다."

classification_order:
  - improved
  - maintained
  - population_fallback
  - no_change
  - not_eligible

classification_rules:
  improved:
    condition: "personal_baseline is not null and actual < personal_baseline"
    baseline_source: personal
  maintained:
    condition: "personal_baseline is not null and improved == false and global_baseline is not null and actual <= global_baseline"
    baseline_source: global
  population_fallback:
    condition: "personal_baseline is null and population_baseline is not null"
    baseline_source: population
  no_change:
    condition: "personal_baseline is not null and improved == false and maintained == false"
  not_eligible:
    condition: "actual is invalid, or personal is not ready and population baseline is unavailable"

point_formula:
  conversion_rate: null
  formula: "max(selected_baseline - actual, 0) / conversion_rate"
  note: "실제 포인트 환산율은 팀 확정 전이므로 null이다. null인 동안 계산 상태는 만들지만 Ledger 지급은 하지 않는다."

points:
  no_change: 0
  not_eligible: null

change_note:
  source_pr: 26
  preserved:
    - "Personal 개선을 Global 유지보다 먼저 판정"
    - "ADLS Gold를 보상 계산의 processing source로 사용"
    - "포인트 환산율을 임의로 정하지 않음"
  corrected_for_baseline_contract:
    - "사용자/주차 1건 평가를 Trip 단위 평가로 변경"
    - "Personal/Global 부재 시 즉시 not_eligible 대신 Population cold-start fallback 적용"
    - "기본 탄소 보상에서 Mission Response를 필수 입력에서 제거"
