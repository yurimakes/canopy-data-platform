policy_version: "reward-policy-v1"

value_usage:
  improvement_check: personal_baseline
  maintenance_check: global_baseline
  note: "personal은 '이 사람 자신의 과거 대비' 개선을 보고, global은 '원래도 평균보다 낮았는가'로 유지를 인정한다. 서로 대체하지 않고 역할이 다르다."

eligibility:
  requires_personal_baseline_or_global_baseline: true
  not_eligible_when: "personal_baseline is null and global_baseline is null, or this week has no eligible trip data"

classification_order:
  - improved
  - maintained
  - no_change
  - not_eligible

classification_order_note: "개선 여부를 먼저 확인한다. 개선이 인정되면 유지 여부는 따로 확인하지 않는다(이중 인정 안 함)."

improved:
  condition: "personal_baseline is not null and (personal_baseline - actual) > 0"
  note: "얼마나 개선돼야 인정되는지의 최소 폭(minimum_delta)은 아직 미정 - 지금은 0보다 크면 인정"

maintained:
  condition: "improved == false and global_baseline is not null and actual <= global_baseline"
  note: "원래 배출이 낮았던 사용자가 그 상태를 유지한 경우"

no_change:
  condition: "improved == false and maintained == false"

points:
  improved: null
  maintained: null
  no_change: 0
  not_eligible: null
  note: "실제 지급 포인트/가중치는 아직 팀 확정 전이라 비워둔다. 상태 분류 로직만 확정."
