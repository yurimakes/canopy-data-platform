policy_version: "behavior-change-policy-v2"

principles:
  mission_independent: true
  causal_attribution: false
  interpretation: "사용자의 해당 주 실제 탄소집약도가 본인 Personal Baseline보다 낮아졌는지를 관측된 Behavior Change로 본다. 미션 수행 여부나 Mission Response는 판정 입력에 사용하지 않는다."

metric:
  name: weekly_carbon_intensity_g_co2e_per_km
  source: weekly_user_gold
  formula: "(total_kg_co2e * 1000) / (total_distance_m / 1000)"
  required_positive_distance: true
  required_valid_carbon: true

reference:
  source: personal_baseline_history
  field: value
  unit: gCO2e_per_km
  same_evaluation_week: true
  require_status: ready
  require_method: personal_cumulative
  population_fallback: false
  global_fallback: false
  reason: "Behavior Change는 사용자 자신의 기준 대비 변화이므로 Personal Baseline이 준비되지 않은 경우 insufficient_data로 둔다."

classification:
  changed:
    condition: "weekly_carbon_intensity_g_co2e_per_km < reference_personal_baseline_g_co2e_per_km"
  no_change:
    condition: "weekly_carbon_intensity_g_co2e_per_km >= reference_personal_baseline_g_co2e_per_km"
  insufficient_data:
    conditions:
      - "weekly distance is null or <= 0"
      - "weekly carbon is null or invalid"
      - "Personal Baseline is not ready"
      - "Personal Baseline value is null or invalid"

outputs:
  reduction_g_co2e_per_km: "reference_personal_baseline_g_co2e_per_km - weekly_carbon_intensity_g_co2e_per_km"
  reduction_rate: "reduction_g_co2e_per_km / reference_personal_baseline_g_co2e_per_km when reference > 0; otherwise null"

explicitly_not_used:
  - mission_bundle
  - mission_progress
  - mission_response
  - assignment_id
  - mission_template_id
  - category_id
  - reward_ledger
