resources:
  jobs:
    complete_payload_finalize:
      name: 5dt016-complete-payload-finalize
      max_concurrent_runs: 4
      parameters:
        - name: trip_id
          default: ""
      tasks:
        - task_key: finalize
          spark_python_task:
            python_file: ${workspace.file_path}/complete_payload/finalize_trip.py
            parameters:
              - --catalog=${var.catalog}
              - --silver-schema=${var.silver_schema}
              - --gps-table=${var.gps_observations_table}
              - --mode-results-schema=${var.mode_results_schema}
              - --mode-results-table=${var.mode_detection_results_table}
              - --output-schema=${var.output_schema}
              - --output-table=${var.complete_payloads_table}
              - --carbon-policy=${workspace.file_path}/assets/carbon_policy.yaml
              - --trip-id={{job.parameters.trip_id}}
          environment_key: finalize_env
      environments:
        - environment_key: finalize_env
          spec:
            environment_version: "4"
            dependencies:
              - PyYAML==6.0.3
