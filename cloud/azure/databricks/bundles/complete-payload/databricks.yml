bundle:
  name: canopy-complete-payload

include:
  - resources/*.yml
  - ../../shared/*.yml

sync:
  include:
    - complete_payload/**
    - assets/**
    - tests/**
    - pyproject.toml

variables:
  silver_schema:
    default: sandbox
  gps_observations_table:
    default: jun_016_silver_gps_observations
  mode_results_schema:
    default: sandbox
  mode_detection_results_table:
    default: jun_016_gold_mode_detection_results
  output_schema:
    default: sandbox
  complete_payloads_table:
    default: jun_016_gold_complete_payloads

targets:
  sandbox:
    default: true
    mode: production
    presets:
      tags:
        environment: trial
        lifecycle: experimental
        component: complete-payload
        owner: 5dt016
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/bundles/.bundle/canopy/${bundle.name}/${bundle.target}
