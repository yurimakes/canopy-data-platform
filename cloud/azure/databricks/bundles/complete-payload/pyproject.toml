[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-complete-payload"
version = "0.1.0"
description = "Assemble sealed mode-detection output into durable complete trip payloads"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["complete_payload*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
