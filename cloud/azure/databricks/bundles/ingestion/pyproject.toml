[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-gps-ingestion"
version = "0.1.0"
description = "Databricks Lakeflow Pipeline A for Canopy GPS ingestion"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "jsonschema>=4.23,<5"]
spark-test = ["pyspark>=4.0,<4.1"]

[tool.setuptools.packages.find]
include = ["gps_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: requires a local Spark 4 runtime with VARIANT support"]
