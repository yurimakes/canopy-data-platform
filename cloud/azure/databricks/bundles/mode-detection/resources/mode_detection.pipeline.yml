resources:
  pipelines:
    mode_detection_pipeline:
      name: canopy-mode-detection-${bundle.target}
      serverless: true
      channel: CURRENT
      catalog: ${var.catalog}
      schema: ${var.output_schema}
      root_path: ${workspace.file_path}
      environment:
        environment_version: "4"
        # Environment v4 already provides joblib, numpy, pandas, scipy, and
        # threadpoolctl. Only override scikit-learn to match the serialized
        # canonical HGBC artifact's training/runtime version.
        dependencies:
          - -e ${workspace.file_path}
          - scikit-learn==1.9.0
          - PyYAML==6.0.3
          - azure-cosmos==4.17.1
      libraries:
        - file:
            path: ${workspace.file_path}/mode_detection/lakeflow_pipeline.py
      configuration:
        spark.sql.session.timeZone: UTC
        canopy.catalog: ${var.catalog}
        canopy.silver_schema: ${var.silver_schema}
        canopy.gps_observations_table: ${var.gps_observations_table}
        canopy.trip_ended_events_table: ${var.trip_ended_events_table}
        canopy.output_schema: ${var.output_schema}
        canopy.complete_payloads_table: ${var.complete_payloads_table}
        canopy.prediction_stride_seconds: ${var.prediction_stride_seconds}
        canopy.gps_gap_tolerance_seconds: ${var.gps_gap_tolerance_seconds}
        canopy.state_ttl_ms: ${var.state_ttl_ms}
        canopy.state_store_partitions: ${var.state_store_partitions}
        canopy.model_artifact_path: ${var.model_artifact_path}
        canopy.transit_reference_root: ${var.transit_reference_root}
        canopy.transit_reference_dir: ${var.transit_reference_dir}
        canopy.carbon_policy_path: ${var.carbon_policy_path}
        canopy.direct_cosmos_sink_enabled: ${var.direct_cosmos_sink_enabled}
        canopy.cosmos_endpoint: ${var.cosmos_endpoint}
        canopy.cosmos_database: ${var.cosmos_database}
        canopy.cosmos_container: ${var.cosmos_container}
        canopy.cosmos_secret_scope: ${var.cosmos_secret_scope}
        canopy.cosmos_key: ${var.cosmos_key}
        spark.canopy.cosmos_credential: "{{secrets/${var.cosmos_secret_scope}/${var.cosmos_key}}}"
        canopy.allow_missing_cosmos_create: ${var.allow_missing_cosmos_create}
