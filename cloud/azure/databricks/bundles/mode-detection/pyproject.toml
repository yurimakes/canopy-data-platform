[project]
name = "canopy-mode-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.2,<3.0",
  "scikit-learn==1.9.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.setuptools.packages.find]
include = ["mode_detection*"]
exclude = ["assets*", "resources*", "scripts*", "tests*"]
