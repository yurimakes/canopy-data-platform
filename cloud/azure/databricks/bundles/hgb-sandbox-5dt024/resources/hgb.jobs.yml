resources:
  jobs:
    sandbox_ingestion_job:
      name: canopy-hgb-5dt024-ingestion-job
      continuous:
        pause_status: ${var.ingestion_continuous_pause_status}
      max_concurrent_runs: 1
      tasks:
      - task_key: ingest
        pipeline_task:
          pipeline_id: ${resources.pipelines.sandbox_ingestion.id}
      permissions:
      - group_name: users
        level: CAN_MANAGE
      run_as:
        user_name: ${workspace.current_user.userName}
      tags:
        component: hgb-sandbox
        environment: ${bundle.target}
      queue:
        enabled: true
    sandbox_hgb_trip:
      name: canopy-hgb-5dt024-trip-job
      max_concurrent_runs: 1
      parameters:
      - name: trip_id
        default: ''
      - name: user_id
        default: ''
      - name: processing_generation
        default: '0'
      tasks:
      - task_key: ingest_app_events
        pipeline_task:
          pipeline_id: ${resources.pipelines.sandbox_ingestion.id}
        timeout_seconds: 600
      - task_key: hgb_trip
        depends_on:
        - task_key: ingest_app_events
        notebook_task:
          notebook_path: ${workspace.file_path}/service/app_trip_notebook.py
          source: WORKSPACE
          base_parameters:
            bundle_root: ${workspace.file_path}
        environment_key: hgb
        timeout_seconds: 600
      environments:
      - environment_key: hgb
        spec:
          environment_version: '4'
          dependencies:
          - scikit-learn==1.9.0
          - pandas==3.0.6
          - numpy==2.5.3
          - scipy==1.18.1
          - joblib==1.6.0
          - PyYAML==6.0.3
      permissions:
      - group_name: users
        level: CAN_MANAGE
      run_as:
        user_name: ${workspace.current_user.userName}
      tags:
        component: hgb-sandbox
        environment: ${bundle.target}
      queue:
        enabled: true
      timeout_seconds: 1500
