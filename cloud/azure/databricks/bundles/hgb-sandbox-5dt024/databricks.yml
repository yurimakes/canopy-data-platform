bundle:
  name: canopy-hgb-sandbox-5dt024
include:
- resources/*.yml
- ../../shared/*.yml
variables:
  bronze_schema:
    default: sandbox
  silver_schema:
    default: sandbox
  bronze_events_table:
    default: m5dt024_bronze_events
  gps_observations_table:
    default: m5dt024_silver_gps_observations
  gps_quarantine_table:
    default: m5dt024_silver_gps_quarantine
  trip_ended_events_table:
    default: m5dt024_silver_trip_ended_events
  deduplication_watermark:
    description: Development default for bounded event_id deduplication state; tune
      per environment.
    default: 1 day
  apply_deduplication:
    description: Apply bounded event_id deduplication to GPS and trip_ended streams.
    default: 'false'
  event_hubs_namespace:
    default: evhns-canopy-dev
  event_hubs_topic:
    default: evh-canopy-sandbox-5dt024
  event_hubs_consumer_group:
    description: Consumer group on the dedicated 5dt024 sandbox Event Hub.
    default: $Default
  event_hubs_sas_policy_name:
    default: canopy-databricks-listen
  event_hubs_secret_scope:
    default: canopy-trial
  event_hubs_secret_key:
    default: canopy-databricks-listen
  ingestion_continuous_pause_status:
    description: Pause status for the generic ingestion continuous job wrapper.
    default: PAUSED
  ingestion_trigger_interval:
    description: Trigger interval for sandbox ingestion.
    default: 1 second
  fuse_gps_parse_validation:
    description: Inline GPS parsing/validation into Silver outputs instead of materializing
      gps_events_parsed.
    default: 'true'
  direct_eventhub_fanout:
    description: Read Event Hubs directly for latency-critical Silver outputs instead
      of routing through persisted Bronze.
    default: 'true'
targets:
  sandbox:
    default: true
    mode: production
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      root_path: /Workspace/bundles/.bundle/canopy/${bundle.name}/${bundle.target}
      profile: CANOPY_TRIAL
    presets:
      tags:
        owner: 5dt024
        lifecycle: sandbox
        component: hgb-test
sync:
  exclude:
  - '**/__pycache__/**'
  - tests/**
