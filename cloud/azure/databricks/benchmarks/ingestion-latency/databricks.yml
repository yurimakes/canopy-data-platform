bundle:
  name: canopy-ingestion-latency-benchmark

include:
  - resources/*.yml

sync:
  include:
    - scripts/**

variables:
  catalog:
    default: dbw_canopy_trial
  schema:
    default: sandbox
  bronze_table:
    default: bronze_events
  gps_table:
    default: silver_gps_observations
  trip_ended_table:
    default: silver_trip_ended_events
  ingestion_pipeline_id:
    default: b862968d-b674-4f78-8137-a2ac2e8fcee9

targets:
  trial:
    default: true
    mode: development
    presets:
      tags:
        environment: trial
        lifecycle: benchmark
        component: ingestion-latency-observer
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
