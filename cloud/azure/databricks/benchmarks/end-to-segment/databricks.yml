bundle:
  name: canopy-end-to-segment-benchmark

include:
  - resources/*.yml

sync:
  include:
    - scripts/**

variables:
  catalog:
    default: dbw_canopy_trial
  schema:
    default: silver
  source_gps_table:
    default: gps_observations
  source_trip_ended_table:
    default: trip_ended_events
  baseline_integrated_segments_table:
    default: mode_segments

targets:
  trial:
    default: true
    mode: development
    presets:
      tags:
        environment: trial
        lifecycle: benchmark
        component: full-path-observer
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
