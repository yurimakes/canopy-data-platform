bundle:
  name: canopy-end-to-segment-benchmark

include:
  - resources/*.yml

sync:
  include:
    - scripts/**

variables:
  catalog:
    default: dbw_canopy_trial
  schema:
    default: sandbox
  source_gps_table:
    default: silver_gps_observations
  source_trip_ended_table:
    default: silver_trip_ended_events
  baseline_integrated_segments_table:
    default: silver_integrated_mode_segments

targets:
  trial:
    default: true
    mode: development
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
