resources:
  jobs:
    continuous_replay_cleanup:
      name: canopy-continuous-replay-cleanup-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: cleanup
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/cleanup_continuous_replay.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
              - --replay-gps-table=${var.replay_gps_table}
              - --replay-trip-ended-table=${var.replay_trip_ended_table}
              - --replay-arrival-table=${var.replay_arrival_table}
              - --benchmark-table=${var.benchmark_table}
          environment_key: cleanup_env

      environments:
        - environment_key: cleanup_env
          spec:
            environment_version: "4"
