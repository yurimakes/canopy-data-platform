[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-sandbox-replay"
version = "0.1.0"
description = "Portable Event Hubs replay fixtures for Canopy sandbox integration testing"
requires-python = ">=3.10"
dependencies = [
    "azure-eventhub>=5.12,<6",
    "python-dotenv>=1.0,<2",
]
