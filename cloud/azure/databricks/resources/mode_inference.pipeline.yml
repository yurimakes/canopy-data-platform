resources:
  pipelines:
    mode_inference_pipeline:
      name: canopy-mode-inference-pipeline-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      serverless: true
      channel: CURRENT
      root_path: ${workspace.file_path}
      libraries:
        - file:
            path: ${workspace.file_path}/mode_inference/lakeflow_pipeline.py
      environment:
        dependencies:
          - -r ${workspace.file_path}/requirements.lakeflow.txt
      configuration:
        canopy.catalog: ${var.catalog}
        canopy.silver_schema: ${var.silver_schema}
        canopy.input_observations_table: ${var.input_observations_table}
        canopy.output_predictions_table: ${var.output_predictions_table}
        canopy.transition_model_uri: ${var.transition_model_uri}
        canopy.state_timeout: ${var.state_timeout}
        spark.sql.session.timeZone: ${var.timezone}
