resources:
  jobs:
    mode_inference_replay:
      name: canopy-mode-inference-replay-job-${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - name: trip_id
          default: 5e8d897e-d159-4b12-af34-3ec4d74a6393
        - name: run_id
          default: manual
      tasks:
        - task_key: prepare_replay
          spark_python_task:
            python_file: ../scripts/prepare_inference_replay.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.silver_schema}
              - --source-table=${var.input_observations_table}
              - --replay-table=${var.replay_input_observations_table}
              - --trip-id={{job.parameters.trip_id}}
              - --run-id={{job.parameters.run_id}}
          environment_key: replay_env

        - task_key: run_replay_inference
          depends_on:
            - task_key: prepare_replay
          pipeline_task:
            pipeline_id: ${resources.pipelines.mode_inference_replay_pipeline.id}
            full_refresh: true

        - task_key: report_replay
          depends_on:
            - task_key: run_replay_inference
          spark_python_task:
            python_file: ../scripts/report_inference_replay.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.silver_schema}
              - --input-table=${var.replay_input_observations_table}
              - --output-table=${var.replay_output_predictions_table}
              - --benchmark-table=${var.replay_benchmark_table}
              - --trip-id={{job.parameters.trip_id}}
              - --run-id={{job.parameters.run_id}}
          environment_key: replay_env

      environments:
        - environment_key: replay_env
          spec:
            environment_version: "4"
