resources:
  pipelines:
    weekly_etl:
      name: canopy-weekly-etl-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.gold_schema}
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ${workspace.file_path}
      libraries:
      - file:
          path: ${workspace.file_path}/weekly_etl/lakeflow.py
      environment:
        environment_version: '4'
        dependencies:
        - ${workspace.file_path}/dist/canopy_downstream_5dt024-0.3.9-py3-none-any.whl
        - azure-cosmos==4.17.1
        - azure-identity==1.25.3
        - azure-storage-blob==12.30.2
        - pandas==3.0.6
        - pyarrow==25.0.1
        - PyYAML==6.0.3
      configuration:
        canopy.catalog: ${var.catalog}
        canopy.gold_schema: ${var.gold_schema}
        spark.sql.session.timeZone: UTC
