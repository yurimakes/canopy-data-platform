resources:
  jobs:
    personal_trip:
      max_concurrent_runs: 1
      queue:
        enabled: true
      environments:
      - environment_key: canopy_env
        spec:
          dependencies:
          - azure-cosmos==4.17.1
          - azure-identity==1.25.3
          - azure-storage-blob==12.30.2
          - pandas==3.0.6
          - pyarrow==25.0.1
          - scikit-learn==1.6.1
          - joblib==1.6.0
          - catboost==1.2.10
          - pyproj==3.7.2
          - PyYAML==6.0.3
          - torch==2.14.0
          environment_version: '4'
      name: canopy-personal-trip-${bundle.target}
      performance_target: PERFORMANCE_OPTIMIZED
      continuous:
        pause_status: ${var.trip_pause_status}
      tasks:
      - task_key: trip
        environment_key: canopy_env
        spark_python_task:
          source: WORKSPACE
          python_file: ${workspace.file_path}/service/resident_worker.py
          parameters:
          - --config
          - '{"storage_url": "https://${var.storage_account}.blob.core.windows.net",
            "scope": "${var.secret_scope}", "storage_key": "storage-key", "container":
            "${var.report_container}", "cosmos_endpoint": "https://cosmos-canopy-dev.documents.azure.com",
            "database": "${var.cosmos_database}", "trips_container": "trips", "cosmos_key":
            "cosmos-key", "gps_table": "${var.catalog}.${var.silver_schema}.gps_observations_live",
            "gps_history_table": "${var.catalog}.${var.silver_schema}.gps_observations",
            "gold_table": "${var.catalog}.${var.gold_schema}.final_trips"}'
        timeout_seconds: 0
