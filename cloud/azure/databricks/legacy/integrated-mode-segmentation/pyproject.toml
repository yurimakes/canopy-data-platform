[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-integrated-mode-segmentation"
version = "0.1.0"
description = "Integrated Lakeflow pipeline for point inference and incremental mode segmentation"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.5,<5",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "scikit-learn>=1.6,<2",
  "skops>=0.10,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
spark = ["pyspark>=4.0,<5"]

[tool.setuptools]
packages = ["integrated_mode_segmentation", "mode_inference"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["spark: requires a local Spark 4 runtime"]
