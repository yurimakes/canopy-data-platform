[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-mode-inference-pipeline"
version = "0.1.0"
description = "Standalone Lakeflow Pipeline B for pointwise transportation-mode inference"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "lightgbm>=4.5,<5",
  "mlflow>=3,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pytest>=8,<9",
  "scikit-learn>=1.6,<2",
]
spark = ["pyspark>=4.0,<5"]

[tool.setuptools.packages.find]
include = ["mode_inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spark: requires a local Spark 4 runtime",
  "registered_model: requires read-only Databricks model access",
]
