bundle:
  name: canopy-generic-event-ingestion

include:
  - resources/*.yml

sync:
  paths:
    - .

variables:
  catalog:
    default: dbw_canopy_trial
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  bronze_events_table:
    default: events
  gps_observations_table:
    default: gps_observations
  gps_quarantine_table:
    default: gps_quarantine
  trip_ended_events_table:
    default: trip_ended_events
  deduplication_watermark:
    description: Development default for bounded event_id deduplication state; tune per environment.
    default: 1 day
  event_hubs_namespace:
    default: evhns-canopy-dev
  event_hubs_topic:
    default: evh-canopy-gps-dev
  event_hubs_consumer_group:
    description: Keep Trial isolated from the legacy consumer group while both pipelines run.
    default: canopy-databricks-trial
  event_hubs_sas_policy_name:
    default: canopy-databricks-listen
  event_hubs_secret_scope:
    default: canopy-trial
  event_hubs_secret_key:
    default: canopy-databricks-listen
  ingestion_continuous_pause_status:
    description: Pause status for the generic ingestion continuous job wrapper.
    default: PAUSED

targets:
  trial:
    default: true
    mode: development
    presets:
      tags:
        environment: trial
        lifecycle: production
        component: ingestion
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
