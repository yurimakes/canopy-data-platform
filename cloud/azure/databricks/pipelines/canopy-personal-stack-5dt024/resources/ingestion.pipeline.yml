resources:
  pipelines:
    personal_gps:
      name: canopy-personal-gps-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      continuous: true
      development: false
      serverless: true
      edition: ADVANCED
      channel: CURRENT
      root_path: ${workspace.file_path}/runtime/cloud/azure/pipelines
      libraries:
      - file:
          path: ${workspace.file_path}/service/gps_pipeline.py
      configuration:
        pipelines.trigger.interval: 1 second
        spark.sql.shuffle.partitions: '4'
        spark.sql.streaming.stateStore.partitions: '4'
        canopy.bronze_events_table: gps_events
        canopy.bronze_schema: ${var.bronze_schema}
        canopy.catalog: ${var.catalog}
        canopy.deduplication_watermark: 1 day
        canopy.event_hubs.consumer_group: personal-5dt024
        canopy.event_hubs.fast_consumer_group: personal-5dt024-fast
        canopy.event_hubs.namespace: ${var.eventhub_namespace}
        canopy.event_hubs.sas_policy_name: ${var.eventhub_sas_policy}
        canopy.event_hubs.secret_key: ${var.eventhub_secret_key}
        canopy.event_hubs.secret_scope: ${var.eventhub_secret_scope}
        canopy.event_hubs.starting_offsets: earliest
        canopy.event_hubs.topic: ${var.eventhub_topic}
        canopy.observations_table: gps_observations
        canopy.quarantine_table: gps_quarantine
        canopy.silver_schema: ${var.silver_schema}
