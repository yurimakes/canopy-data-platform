resources:
  pipelines:
    segment_generation_low_latency_replay_pipeline:
      name: canopy-segment-generation-low-latency-replay-${bundle.target}
      serverless: true
      channel: CURRENT
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: ${workspace.file_path}
      libraries:
        - file:
            path: ${workspace.file_path}/segment_generation/low_latency_replay_pipeline.py
      configuration:
        pipelines.trigger.interval: ${var.low_latency_replay_trigger_interval}
        canopy.catalog: ${var.catalog}
        canopy.schema: ${var.schema}
        canopy.trip_ended_table: ${var.replay_trip_ended_table}
        canopy.gps_observations_table: ${var.replay_gps_observations_table}
        canopy.mode_predictions_table: ${var.replay_mode_predictions_table}
        canopy.segments_table: ${var.replay_low_latency_segments_table}
        canopy.telemetry_table: ${var.replay_low_latency_telemetry_table}
        canopy.max_repair_gap_seconds: ${var.max_repair_gap_seconds}
