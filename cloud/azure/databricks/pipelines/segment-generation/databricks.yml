bundle:
  name: canopy-segment-generation-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    default: dbw_canopy_trial
  schema:
    default: sandbox
  trip_ended_table:
    default: silver_trip_ended_events
  gps_observations_table:
    default: silver_gps_observations
  mode_predictions_table:
    default: silver_mode_predictions
  segments_table:
    default: silver_mode_segments
  replay_trip_ended_table:
    default: replay_continuous_trip_ended_events
  replay_gps_observations_table:
    default: replay_continuous_gps_observations
  replay_mode_predictions_table:
    default: replay_continuous_mode_predictions
  replay_segments_table:
    default: replay_continuous_mode_segments
  replay_low_latency_segments_table:
    default: replay_low_latency_mode_segments
  low_latency_replay_continuous_pause_status:
    description: Low-latency replay continuous job state; keep PAUSED by default in development and override to UNPAUSED only for intentional tests.
    default: PAUSED
  low_latency_replay_trigger_interval:
    description: Standard-mode low-latency segment replay trigger interval. Default to 0 seconds for latency testing.
    default: 0 seconds
  max_repair_gap_seconds:
    description: Maximum adjacent event-time gap for one-point repair.
    default: 3

targets:
  trial:
    default: true
    mode: development
    presets:
      tags:
        environment: trial
        lifecycle: development
        component: segment-generation
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
