bundle:
  name: canopy-mode-inference

include:
  - resources/*.yml

sync:
  include:
    - mode_inference/**
    - requirements.lakeflow.txt
    - scripts/**
  exclude:
    - .venv/**
    - tests/**
    - '**/__pycache__/**'

variables:
  catalog:
    default: dbw_canopy_trial
  silver_schema:
    default: sandbox
  input_observations_table:
    default: silver_gps_observations
  output_predictions_table:
    default: silver_mode_predictions
  replay_input_observations_table:
    default: replay_gps_observations
  replay_output_predictions_table:
    default: replay_mode_predictions
  replay_benchmark_table:
    default: replay_inference_benchmarks
  continuous_replay_input_table:
    default: replay_continuous_gps_observations
  continuous_replay_output_table:
    default: replay_continuous_mode_predictions
  replay_continuous_pause_status:
    description: Continuous replay job state; keep PAUSED by default in development and override to UNPAUSED only for intentional tests.
    default: PAUSED
  continuous_replay_trigger_interval:
    description: Standard-mode replay trigger interval. Keep 1 second by default; override for controlled latency experiments.
    default: 1 second
  transition_model_uri:
    description: Registered-model identity retained for output metadata.
    default: models:/dbw_canopy_trial.ml.canopy_transition_lgbm_pointwise/1
  transition_model_artifact_path:
    description: Native LightGBM skops artifact in a Unity Catalog Volume.
    default: /Volumes/dbw_canopy_trial/ml/runtime_artifacts/canopy_transition_lgbm_pointwise_v1.skops
  state_timeout:
    description: Processing-time TTL for per-trip inference state. Placeholder guardrail until explicit trip_ended cleanup is implemented.
    default: 2h
  timezone:
    default: UTC

targets:
  trial:
    default: true
    mode: development
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
