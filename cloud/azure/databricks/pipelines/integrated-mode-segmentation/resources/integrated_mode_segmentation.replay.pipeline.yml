resources:
  pipelines:
    integrated_mode_segmentation_replay_pipeline:
      name: canopy-integrated-mode-segmentation-replay-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      root_path: ${workspace.file_path}
      libraries:
        - file:
            path: ${workspace.file_path}/integrated_mode_segmentation/lakeflow_pipeline.py
        - whl: ./dist/*.whl
      environment:
        environment_version: "4"
      configuration:
        pipelines.trigger.interval: "1 second"
        canopy.catalog: ${var.catalog}
        canopy.schema: ${var.schema}
        canopy.input_observations_table: ${var.replay_input_observations_table}
        canopy.input_trip_ended_table: ${var.replay_input_trip_ended_table}
        canopy.output_predictions_table: ${var.replay_output_predictions_table}
        canopy.output_enriched_predictions_table: ${var.replay_output_enriched_predictions_table}
        canopy.output_segments_table: ${var.replay_output_segments_table}
        canopy.transition_model_uri: ${var.transition_model_uri}
        canopy.transition_model_artifact_path: ${var.transition_model_artifact_path}
        canopy.state_timeout: ${var.state_timeout}
        canopy.state_store_partitions: ${var.state_store_partitions}
        canopy.max_repair_gap_seconds: ${var.max_repair_gap_seconds}
        spark.sql.session.timeZone: ${var.timezone}
