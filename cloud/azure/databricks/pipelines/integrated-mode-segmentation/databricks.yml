bundle:
  name: canopy-integrated-mode-segmentation

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: uv build --wheel --out-dir dist

sync:
  include:
    - integrated_mode_segmentation/**
    - requirements.lakeflow.txt
    - dist/*.whl
  exclude:
    - .venv/**
    - tests/**
    - '**/__pycache__/**'

variables:
  catalog:
    default: dbw_canopy_trial
  schema:
    default: sandbox
  replay_input_observations_table:
    default: replay_continuous_gps_observations
  replay_input_trip_ended_table:
    default: replay_continuous_trip_ended_events
  replay_output_predictions_table:
    default: replay_integrated_mode_predictions
  replay_output_enriched_predictions_table:
    default: replay_integrated_enriched_mode_predictions
  replay_output_segments_table:
    default: replay_integrated_mode_segments
  baseline_input_observations_table:
    default: silver_gps_observations
  baseline_input_trip_ended_table:
    default: silver_trip_ended_events
  baseline_output_segments_table:
    default: silver_integrated_mode_segments
  transition_model_uri:
    default: models:/dbw_canopy_trial.ml.canopy_transition_lgbm_pointwise/1
  transition_model_artifact_path:
    default: /Volumes/dbw_canopy_trial/ml/runtime_artifacts/canopy_transition_lgbm_pointwise_v1.skops
  state_timeout:
    description: Processing-time TTL for inference and segmentation state.
    default: 2h
  state_store_partitions:
    description: State-store partitions retained from the verified inference latency configuration.
    default: 4
  max_repair_gap_seconds:
    description: Maximum adjacent event-time gap for smoothing repairs.
    default: 3
  timezone:
    default: UTC
  integrated_continuous_pause_status:
    description: Pause status for the development replay continuous job wrapper.
    default: PAUSED
  baseline_continuous_pause_status:
    description: Pause status for the production-shaped baseline continuous job wrapper.
    default: PAUSED

targets:
  trial:
    default: true
    mode: development
    presets:
      tags:
        environment: trial
        lifecycle: development
        component: integrated-mode-segmentation
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      profile: CANOPY_TRIAL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
