bundle:
  name: canopy-final-trip-5dt024
include:
- resources/*.yml
sync:
  include:
  - dist/*.whl
  exclude:
  - '**/__pycache__/**'
  - .pytest_cache/**
variables:
  catalog:
    default: dbw_canopy_trial
  gold_schema:
    default: gold_5dt024
  cosmos_endpoint:
    default: https://cosmos-canopy-dev.documents.azure.com:443/
  cosmos_database:
    default: canopy-db
  cosmos_secret_scope:
    default: canopy-downstream-5dt024
  cosmos_secret_key:
    default: cosmos-key
  final_trip_continuous_pause_status:
    default: PAUSED
  silver_schema:
    default: silver
targets:
  trial:
    default: true
    mode: development
    presets:
      name_prefix: '[dev 5dt024] '
      tags:
        environment: trial
        component: final-trip
        owner: 5dt024
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
  qa:
    mode: development
    presets:
      name_prefix: '[dev 5dt024] '
      tags:
        environment: trial
        component: final-trip
        owner: 5dt024
        purpose: isolated-validation
    workspace:
      host: https://adb-7405612422597045.5.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
    variables:
      gold_schema: qa_gold_5dt024
      cosmos_database: canopy-qa-5dt024
      silver_schema: qa_silver_5dt024
artifacts:
  runtime:
    type: whl
    path: .
    build: python build_wheel.py
